# nginx in front of Streamlit (container/entrypoint.sh starts both).
# Runs as the unprivileged user "app": high port, pid and temp files in /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 5m;
    sendfile on;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Streamlit talks to the browser over a websocket (/_stcore/stream).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream streamlit {
        server 127.0.0.1:8501;
    }

    server {
        listen 8080;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health endpoint for the container healthcheck, load balancers and the smoke test
        location = /healthz {
            access_log off;
            proxy_pass http://streamlit/_stcore/health;
        }

        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            # Fetching from NASA (ETD_FETCH) can keep a session busy for many minutes.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
